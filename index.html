<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elanthian Moons</title>
<style>
  :root {
    --bg: #0b0d1a; --panel: #151830; --panel2: #1d2142;
    --ink: #e9e9f2; --dim: #9aa0c0; --accent: #b9a6ff;
    --up: #7ee0a5; --down: #5a6088;
    /* Moon name hues echo each moon's sky atmosphere (Katamba violet, Xibar
       ice-blue, Yavash crimson) so the cards and the scene agree. */
    --katamba: #b49ae0; --xibar: #8fc7f0; --yavash: #ff8496;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background:
      radial-gradient(1200px 600px at 70% -10%, #1a1f45 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-weight: 600; font-size: 26px; margin: 0 0 20px; letter-spacing: .5px; text-align: center; }
  .sub { color: var(--dim); margin-bottom: 20px; font-size: 13px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; margin-bottom: 22px;
  }
  .chip {
    background: var(--panel); border: 1px solid #262b52; border-radius: 12px;
    padding: 12px 16px; flex: 1 1 200px;
  }
  .chip .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .chip .v { font-size: 18px; margin-top: 2px; }
  .chip .v small { color: var(--dim); font-size: 13px; }
  /* The sky panel doubles as the scene container (ported from Lichborne). The
     backdrop is a stack of absolutely-positioned gradient layers whose opacity
     is crossfaded by sun elevation each tick; the SVG scene sits on top. A real
     width AND height are needed so the render can measure the aspect and widen
     the horizon on resize (see the geometry note in the script). */
  .sky {
    margin-bottom: 22px; border: 1px solid #262b52; border-radius: 16px;
    overflow: hidden; background: #080a18; position: relative;
    aspect-ratio: 3 / 1; min-height: 210px;
    font-size: 12px; transition: color 2.5s linear;
    --moons-guide: var(--accent);
  }
  @media (max-width: 620px) { .sky { aspect-ratio: 16 / 9; } }
  .moons { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .moon {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid #2a2f5a; border-radius: 16px; padding: 18px; display: flex; gap: 16px;
  }
  /* The card disc now holds a small SVG moon rendered with the SAME lore
     colours + phase shape + glow as the sky scene (see moonCardSVG). */
  .disc { width: 64px; height: 64px; flex: 0 0 64px; align-self: center; display: flex; }
  .disc svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .moon .name { font-size: 18px; font-weight: 600; }
  .moon .phase { color: var(--accent); margin: 2px 0 8px; }
  .moon .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  .moon .row .lbl { color: var(--dim); }
  .status-up { color: var(--up); font-weight: 600; }
  .status-down { color: var(--down); font-weight: 600; }
  .kat .name { color: var(--katamba); }
  .xib .name { color: var(--xibar); }
  .yav .name { color: var(--yavash); }
  .section-title { margin: 26px 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .orient { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: normal; cursor: pointer; color: var(--dim); font-size: 12px; }
  .orient input { accent-color: var(--accent); cursor: pointer; }
  /* Orientation toggle floated over the scene's top-right corner - absolutely
     positioned so it overlays the image and shifts no other element. A subtle
     pill keeps it legible against any day/night sky. */
  .sky-orient {
    position: absolute; top: 8px; right: 10px; z-index: 2;
    background: rgba(11, 13, 26, 0.55); border: 1px solid #262b52;
    border-radius: 999px; padding: 4px 10px; color: var(--ink);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .conj { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 22px; }
  .conj .card { background: var(--panel); border: 1px solid #262b52; border-radius: 12px; padding: 14px 16px; }
  .conj .big { font-size: 20px; margin-top: 4px; }
  .foot { margin-top: 30px; color: var(--dim); font-size: 12px; line-height: 1.6; border-top: 1px solid #222750; padding-top: 14px; }
  code { background: #11142a; padding: 1px 5px; border-radius: 4px; color: #c8cdf5; }

  /* ========================================================================
     Lichborne sky scene styles - ported (with permission) from Lichborne by
     Sekmeht and Binu (https://github.com/SekmehtDR/Lichborne). Class names and
     keyframes keep the moons- prefix. Fixed hues are deliberate (a realistic
     sky / lore, not theme). Weather-effect rules are intentionally omitted.
     ======================================================================== */

  /* Continuous-sky gradient stack - opacity-crossfaded by the sun-elevation
     weights computed each tick (night base always on; day/zenith/twilight fade
     over it). The 2.5s transition smooths the per-second steps. */
  .moons-layer {
    position: absolute; inset: 0; pointer-events: none;
    transition: opacity 2.5s linear;
  }
  .moons-layer--night { background: linear-gradient(180deg, #070a18, #141c34 65%, #1c2340); }
  /* Day/zenith bases are fairly uniform - the sun-centric radial glow provides
     the bright focus, so the sky reads as lit by the sun rather than glowing
     along the whole horizon. */
  .moons-layer--day    { background: linear-gradient(180deg, #5896cd, #86bce3 58%, #9ec7e8); }
  .moons-layer--zenith { background: linear-gradient(180deg, #7ab2e4, #a4d0ef 52%, #b4d9f4); }
  /* Twilight: a full-width mauve wash for dusk/dawn; the horizon orange is
     softened because the sun glow carries the concentrated warm colour. */
  .moons-layer--twilight { background: linear-gradient(180deg, rgba(38, 42, 82, 0.88), rgba(118, 74, 104, 0.72) 55%, rgba(210, 132, 88, 0.52)); }

  .moons-svg {
    display: block; width: 100%; height: 100%;
    position: relative; z-index: 1;   /* above the gradient layer stack */
  }

  /* Rising / setting horizon rings: slow (3.2s), soft, two staggered rings -
     expanding for a rise, contracting for a set. Chromium/WebKit animate the
     CSS r geometry property on SVG circles. */
  .moons-ring-rise, .moons-ring-set { stroke-width: 1.2; animation: 3.2s linear infinite; }
  .moons-ring-rise { animation-name: moons-ring-rise; }
  .moons-ring-set  { animation-name: moons-ring-set; }
  @keyframes moons-ring-rise {
    0%   { r: var(--ring-r); opacity: 0.5; }
    100% { r: var(--ring-R); opacity: 0; }
  }
  @keyframes moons-ring-set {
    0%   { r: var(--ring-R); opacity: 0; }
    30%  { opacity: 0.45; }
    100% { r: var(--ring-r); opacity: 0; }
  }

  /* The arc guide the bodies ride. A halo pass (opposite-lightness sky ink)
     under the dashed guide so it reads on a bright day AND a dark night. Round
     caps + a very short dash render each mark as a dot (a surveyed track, not a
     cartoon line); the ends fade into the horizon via a mask in the render. */
  .moons-arc-halo {
    stroke: var(--moons-halo, transparent); stroke-width: 3;
    stroke-dasharray: 0.5 5.5; stroke-linecap: round; opacity: 0.5;
  }
  .moons-arc-guide {
    stroke: color-mix(in srgb, var(--moons-guide, currentColor) 50%, currentColor);
    stroke-width: 1.5; stroke-dasharray: 0.5 5.5; stroke-linecap: round; opacity: 0.62;
  }
  .moons-horizon { stroke: currentColor; stroke-width: 1; opacity: 0.45; }

  /* Below-horizon schematic: a dashed arc dipping under the horizon that carries
     the down-moons as ghosted, dashed-rim discs with labels - echoes the
     pre-Lichborne view so moons that have set still read as travelling out of
     sight. currentColor is the scene ink, so the guide stays legible on any sky
     or ground; the moon discs/labels are dimmed to read as "beneath". */
  .moons-underarc {
    stroke: currentColor; stroke-width: 1; opacity: 0.4;
    stroke-dasharray: 5 5; stroke-linecap: round;
  }
  .moons-underbody { opacity: 0.55; }
  .moons-underlabel { opacity: 0.85; }

  /* Horizon silhouette - near-black fixed hue (a landscape in shadow reads
     against every sky state). Drawn after the bodies + the opaque ground, so a
     setting sun or moon sinks behind the peaks. */
  .moons-ridge { stroke: none; }
  .moons-ridge--far  { fill: #0d1018; opacity: 0.45; }
  .moons-ridge--near { fill: #0a0c12; opacity: 0.88; }
  /* Winter: a bright snow line along the ridge tops + snowier ridge fill. */
  .moons-ridge--snow { fill: #20262f; }
  .moons-ridge-snowcap { stroke: #eef3fb; stroke-width: 1.4; stroke-linejoin: round; opacity: 0.5; }

  /* Crepuscular ground rays - a gentle shimmer on the light beams at sunrise
     (shadow rays at sunset stay static). */
  .moons-ray--anim { animation: moons-ray-shimmer 5s ease-in-out infinite; }
  @keyframes moons-ray-shimmer { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* Star twinkle. Animates fill-opacity (not opacity) so it multiplies with
     each star's own reveal-level opacity instead of overriding it. */
  .moons-star { animation: moons-twinkle 3s ease-in-out infinite; }
  @keyframes moons-twinkle { 0%, 100% { fill-opacity: 0.45; } 50% { fill-opacity: 1; } }

  /* Shooting stars: each streaks from (--sx,--sy) to (--ex,--ey) over its own
     long cycle (--dur), visible for a tiny slice of it so a streak is rare but
     still flashes past in ~1.5s. */
  .moons-shooting { animation: moons-shoot var(--dur, 9s) ease-in infinite; opacity: 0; }
  @keyframes moons-shoot {
    0%    { transform: translate(var(--sx), var(--sy)); opacity: 0; }
    0.2%  { opacity: 0.95; }
    0.8%  { transform: translate(var(--ex), var(--ey)); opacity: 0; }
    100%  { transform: translate(var(--ex), var(--ey)); opacity: 0; }
  }

  /* Fireflies: a soft glowing drift-and-blink near the ground on summer nights.
     --drift is the per-firefly horizontal travel. */
  .moons-firefly {
    fill: #eaff8f; filter: drop-shadow(0 0 2px #cdff5e);
    animation-name: moons-firefly-drift; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes moons-firefly-drift {
    0%, 100% { opacity: 0.15; transform: translate(0, 0); }
    50%      { opacity: 0.9;  transform: translate(var(--drift, 5px), -6px); }
  }

  /* Autumn falling leaves, fluttering down over the landscape. */
  .moons-leaf {
    animation: moons-leaf-fall linear infinite;
    transform-box: fill-box; transform-origin: center;
  }
  @keyframes moons-leaf-fall {
    0%   { transform: translateY(-6px) translateX(0) rotate(0deg); opacity: 0; }
    12%  { opacity: 0.92; }
    88%  { opacity: 0.92; }
    100% { transform: translateY(var(--fall)) translateX(var(--sway)) rotate(240deg); opacity: 0; }
  }

  /* Scene text (names / countdown chips / the day word) - currentColor picks up
     the scene's day/night ink, and the --moons-halo stroke (opposite lightness,
     drawn behind the fill via paint-order) lifts it off any sky. Dilution is
     fill-opacity, not element opacity, so the halo stays solid. */
  .moons-name {
    font-size: calc(var(--game-font-size, 12px) * 0.917);
    fill: currentColor; fill-opacity: 1;
    stroke: var(--moons-halo, transparent); stroke-width: 3.4px;
    stroke-linejoin: round; paint-order: stroke; font-weight: 600;
  }
  .moons-chip {
    font-size: calc(var(--game-font-size, 12px) * 0.792);
    fill: currentColor; fill-opacity: 0.97;
    stroke: var(--moons-halo, transparent); stroke-width: 2.9px;
    stroke-linejoin: round; paint-order: stroke;
  }
  .moons-phase-label {
    font-size: calc(var(--game-font-size, 12px) * 1.05);
    fill: currentColor; fill-opacity: 1;
    stroke: var(--moons-halo, transparent); stroke-width: 3.8px;
    stroke-linejoin: round; paint-order: stroke;
    text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700;
  }
  .moons-phase-sub {
    font-size: calc(var(--game-font-size, 12px) * 0.62);
    font-weight: 600; fill-opacity: 0.9; stroke-width: 2.4px; letter-spacing: 0.08em;
  }
  .moons-label-cardinal { fill: #2b3a5c; font-size: 11px; opacity: 0.9; }

  /* Card moon disc: a gentle idle breathing of the sky-hue glow so the cards
     feel as alive as the scene (opacity comes from the phase; only scale pulses,
     so the illum-scaled glow is preserved). Phase-anchored per render like the
     scene animations. */
  .moons-card-glow {
    transform-box: fill-box; transform-origin: center;
    animation: moons-card-pulse 6s ease-in-out infinite;
  }
  @keyframes moons-card-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* Accessibility: respect the OS reduced-motion setting (maps Lichborne's
     epilepsy-safe gate). The render also skips motion FX when this is set. */
  @media (prefers-reduced-motion: reduce) {
    .moons-star, .moons-shooting, .moons-firefly, .moons-leaf,
    .moons-ring-rise, .moons-ring-set, .moons-ray--anim, .moons-card-glow { animation: none !important; }
    .moons-layer { transition: none; }
    .sky { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Elanthian Moons</h1>

  <div class="sky" id="scene">
    <div class="moons-layer moons-layer--night"></div>
    <div class="moons-layer moons-layer--day" id="layer-day"></div>
    <div class="moons-layer moons-layer--zenith" id="layer-zenith"></div>
    <div class="moons-layer moons-layer--twilight" id="layer-twilight"></div>
    <svg class="moons-svg" id="scene-svg" role="img" aria-label="The moons and sun on their arcs across Elanthia's sky"></svg>
    <label class="orient sky-orient"><input type="checkbox" id="facing-north" checked> <span id="facing-label">Facing North</span></label>
  </div>

  <div class="moons" id="moons"></div>

  <div class="conj">
    <div class="card"><div class="k" style="color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em">All three above the horizon</div><div class="big" id="allup">-</div></div>
    <div class="card"><div class="k" style="color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em">All three below the horizon</div><div class="big" id="alldown">-</div></div>
  </div>

  <div class="bar">
    <div class="chip"><div class="k">Elanthian date</div><div class="v" id="cal-date">-</div></div>
    <div class="chip"><div class="k">Hour / season</div><div class="v" id="cal-hour">-</div></div>
    <div class="chip"><div class="k">Sun</div><div class="v" id="sun">-</div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";

// ============================================================================
// DragonRealms moon model - self-contained, deterministic, dependency-free.
// Moon periods are the game's sidereal orbits (cross-validated to under a
// second); phase, sun and calendar use validated constants and empirical tables.
// Everything below computes purely from a Unix timestamp - no network, no state.
// ============================================================================
var MOONS = {
  katamba: { epoch: 1771558850, cycle: 21088.611, visible: 10602, sidereal: 14847, label: "Katamba", cls: "kat" },
  xibar:   { epoch: 1771560044, cycle: 20848.143, visible: 10482, sidereal: 9983,  label: "Xibar",   cls: "xib" },
  yavash:  { epoch: 1771555118, cycle: 21129.564, visible: 10624, sidereal: 16171, label: "Yavash",  cls: "yav" }
};
var MOON_ORDER = ["katamba", "xibar", "yavash"];
var PHASE_NAMES = ["new", "waxing crescent", "first quarter", "waxing gibbous", "full", "waning gibbous", "third quarter", "waning crescent"];
var PHASE_SKEW_ROIS = 80895;      // 4,853,700 / 60
var DPY = 400;

// Calendar
var CAL_EPOCH = 1688607948, CAL_YEAR = 446;
var SEC_ROIS = 60, SEC_ANLAS = 1800, SEC_DAY = 21600, DAYS_MONTH = 40;
var ANLAS_NAMES = ["Anduwen", "Starwatch", "Asketi's Hunt", "Berengaria's Touch", "Hodierna's Blessing", "Peri'el's Watch", "Dergati's Bane", "Firulf's Flame", "Tamsine's Toil", "Meraud's Cloak", "Phelim's Vigil", "Revelfae"];
var MONTH_NAMES = [null, "Akroeg the Ram", "Ka'len the Sea Drake", "Lirisa the Archer", "Shorka the Cobra", "Uthmor the Giant", "Arhat the Fire Lion", "Moliko the Balance", "Skullcleaver the Dwarven Axe", "Dolefaren the Brigantine", "Nissa the Maiden"];   // index 0 is null (months are 1-based)
var YEAR_NAMES  = [null, "Year of the Bronze Wyvern", "Year of the Golden Panther", "Year of the Amber Phoenix", "Year of the Iron Toad", "Year of the Emerald Dolphin", "Year of the Crystal Snow Hare", "Year of the Silver Unicorn"];    // index 0 is null (cycle is 1-7)

// Sun empirical lookup tables (rois per day-of-year, 0-399)
var SUN_RISE = [120, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 118, 118, 118, 118, 118, 118, 118, 118, 117, 117, 117, 116, 115, 115, 115, 115, 115, 114, 114, 114, 114, 113, 113, 113, 113, 112, 112, 112, 111, 111, 111, 110, 110, 110, 110, 109, 109, 109, 108, 108, 107, 107, 107, 106, 106, 106, 105, 105, 104, 104, 104, 103, 103, 102, 102, 102, 101, 101, 100, 100, 99, 99, 98, 98, 98, 97, 97, 96, 96, 95, 95, 94, 94, 93, 93, 94, 93, 93, 92, 92, 91, 91, 90, 90, 90, 90, 89, 89, 88, 88, 87, 87, 86, 86, 86, 85, 85, 84, 84, 83, 83, 82, 82, 81, 81, 81, 80, 80, 80, 79, 78, 78, 77, 77, 77, 76, 76, 75, 75, 75, 74, 74, 73, 73, 73, 72, 72, 72, 71, 71, 70, 70, 70, 69, 69, 69, 69, 68, 68, 68, 67, 67, 67, 66, 66, 66, 66, 65, 65, 65, 65, 65, 64, 64, 64, 64, 63, 63, 63, 63, 62, 62, 62, 62, 62, 62, 62, 62, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 60, 60, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 61, 62, 62, 62, 62, 62, 62, 62, 62, 63, 63, 63, 63, 64, 64, 64, 64, 64, 65, 65, 65, 65, 66, 66, 66, 66, 67, 67, 67, 68, 68, 68, 69, 69, 69, 69, 70, 70, 70, 71, 71, 72, 72, 72, 73, 73, 73, 74, 74, 75, 75, 75, 76, 76, 77, 77, 77, 78, 78, 79, 79, 80, 80, 81, 81, 81, 82, 82, 83, 83, 84, 84, 85, 85, 86, 86, 86, 87, 87, 88, 88, 89, 89, 90, 90, 90, 90, 91, 91, 92, 92, 93, 93, 94, 94, 94, 95, 95, 96, 96, 97, 97, 98, 98, 99, 99, 99, 100, 100, 101, 101, 102, 102, 103, 103, 103, 104, 104, 105, 105, 105, 106, 106, 107, 107, 107, 108, 108, 108, 109, 109, 110, 110, 110, 111, 111, 111, 111, 112, 112, 112, 113, 113, 113, 114, 114, 114, 114, 115, 115, 115, 116, 116, 116, 116, 116, 116, 117, 117, 117, 117, 118, 118, 118, 118, 118, 118, 118, 118, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 120];
var SUN_SET  = [240, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 242, 242, 242, 242, 242, 242, 242, 242, 243, 243, 243, 242, 243, 243, 243, 243, 243, 244, 244, 244, 244, 245, 245, 245, 245, 246, 246, 246, 247, 247, 247, 248, 248, 248, 248, 249, 249, 249, 250, 250, 251, 251, 251, 252, 252, 252, 253, 253, 254, 254, 254, 255, 255, 256, 256, 256, 257, 257, 258, 258, 259, 259, 260, 260, 260, 261, 261, 262, 262, 263, 263, 264, 264, 265, 265, 266, 267, 267, 268, 268, 269, 269, 270, 270, 270, 270, 271, 271, 272, 272, 273, 273, 274, 274, 274, 275, 275, 276, 276, 277, 277, 278, 278, 279, 279, 279, 280, 280, 281, 281, 282, 282, 283, 283, 283, 284, 284, 285, 285, 285, 286, 286, 287, 287, 287, 288, 288, 288, 289, 289, 290, 290, 290, 291, 291, 291, 291, 292, 292, 292, 293, 293, 293, 294, 294, 294, 294, 295, 295, 295, 296, 296, 296, 296, 296, 296, 297, 297, 297, 297, 298, 298, 298, 298, 298, 298, 298, 298, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 300, 300, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 299, 298, 298, 298, 298, 298, 298, 298, 298, 297, 297, 297, 297, 296, 296, 296, 296, 296, 295, 295, 295, 295, 294, 294, 294, 294, 293, 293, 293, 292, 292, 292, 291, 291, 291, 291, 290, 290, 290, 289, 289, 288, 288, 288, 287, 287, 287, 286, 286, 285, 285, 285, 284, 284, 283, 283, 283, 282, 282, 281, 281, 280, 280, 279, 279, 279, 278, 278, 277, 277, 276, 276, 275, 275, 274, 274, 274, 273, 273, 272, 272, 271, 271, 270, 270, 270, 270, 269, 269, 268, 268, 267, 267, 266, 266, 266, 265, 265, 264, 264, 263, 263, 262, 262, 261, 261, 261, 260, 260, 259, 259, 258, 258, 257, 257, 257, 256, 256, 255, 255, 255, 254, 254, 253, 253, 253, 252, 252, 252, 251, 251, 250, 250, 250, 249, 249, 249, 249, 248, 248, 248, 247, 247, 247, 246, 246, 246, 246, 245, 245, 245, 245, 244, 244, 244, 244, 244, 243, 243, 243, 243, 242, 242, 242, 242, 242, 242, 242, 242, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 241, 240];

// ============================================================================
// Model
// ============================================================================
function imod(a, n) { return ((a % n) + n) % n; }

function calcDate(t) {
  var total = t - CAL_EPOCH;
  var SPY = SEC_DAY * DPY;                 // 8,640,000
  var years = Math.floor(total / SPY);
  var rem = imod(total, SPY);
  var doy = Math.floor(rem / SEC_DAY);     // 0-399
  var sid = imod(rem, SEC_DAY);            // 0-21599
  return {
    year: CAL_YEAR + years,
    month: Math.floor(doy / DAYS_MONTH) + 1,
    day: (doy % DAYS_MONTH) + 1,
    doy: doy,
    anlas: Math.floor(sid / SEC_ANLAS),
    rois: Math.floor((sid % SEC_ANLAS) / SEC_ROIS),
    sid: sid
  };
}

function yearName(y) { var c = y % 7; if (c === 0) c = 7; return YEAR_NAMES[c]; }
function sunTimes(doy) { return { rise: SUN_RISE[doy] * 60, set: SUN_SET[doy] * 60 }; }

function season(doy) {
  if (doy < 50) return "winter";
  if (doy < 150) return "spring";
  if (doy < 250) return "summer";
  if (doy < 350) return "fall";
  return "winter";
}

function timeOfDay(sid, doy) {

  MOON_ORDER.forEach(function (m) {
    var st = MOON_STYLE[m], gs = st.glowStrength;
    o += '<radialGradient id="lb-glow-' + m + '" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="' + st.glow + '" stop-opacity="' + (0.45 * gs) + '"/><stop offset="55%" stop-color="' + st.glow + '" stop-opacity="' + (0.2 * gs) + '"/><stop offset="100%" stop-color="' + st.glow + '" stop-opacity="0"/></radialGradient>';
  });
  o += '<linearGradient id="lb-shoot" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#eaf2ff" stop-opacity="0"/><stop offset="100%" stop-color="#eaf2ff" stop-opacity="1"/></linearGradient>';
  function sunMix(base) { return "color-mix(in srgb, " + M.sunLight.color + " " + Math.round(M.sunLight.strength * 48) + "%, " + base + ")"; }
  M.upLit.forEach(function (u) {
    if (!u.lit) return;
    var st = u.b.s;
    o += '<radialGradient id="lb-moon-dyn-' + u.b.k + '" cx="' + (u.lit.cx * 100) + '%" cy="' + (u.lit.cy * 100) + '%" r="78%"><stop offset="0%" style="stop-color:' + sunMix(st.tones.lit) + '"/><stop offset="42%" stop-color="' + st.tones.lit + '"/><stop offset="72%" stop-color="' + st.tones.mid + '"/><stop offset="100%" stop-color="' + st.tones.shadow + '"/></radialGradient>';
  });
  o += '<mask id="lb-sun-occl" maskUnits="userSpaceOnUse" x="0" y="0" width="' + W + '" height="' + HY + '"><rect x="0" y="0" width="' + W + '" height="' + HY + '" fill="#fff"/>';
  M.upLit.forEach(function (u) { o += '<circle cx="' + u.b.x + '" cy="' + u.b.y + '" r="' + u.b.s.r + '" fill="#000"/>'; });
  o += '</mask>';
  o += '<mask id="lb-arcfade" maskUnits="userSpaceOnUse" x="' + (CX - ARC_RX) + '" y="0" width="' + (ARC_RX * 2) + '" height="' + (HY + 2) + '"><linearGradient id="lb-arcfadeg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#000"/><stop offset="13%" stop-color="#fff"/><stop offset="87%" stop-color="#fff"/><stop offset="100%" stop-color="#000"/></linearGradient><rect x="' + (CX - ARC_RX) + '" y="0" width="' + (ARC_RX * 2) + '" height="' + (HY + 2) + '" fill="url(#lb-arcfadeg)"/></mask>';
  o += '<mask id="lb-underfade" maskUnits="userSpaceOnUse" x="' + (CX - ARC_RX) + '" y="' + HY + '" width="' + (ARC_RX * 2) + '" height="' + (SC.UNDER_DEPTH + 2) + '"><rect x="' + (CX - ARC_RX) + '" y="' + HY + '" width="' + (ARC_RX * 2) + '" height="' + (SC.UNDER_DEPTH + 2) + '" fill="url(#lb-arcfadeg)"/></mask>';
  if (M.sunGlow) o += '<radialGradient id="lb-sunglow" gradientUnits="userSpaceOnUse" cx="' + M.sunGlow.x + '" cy="' + M.sunGlow.y + '" r="' + M.sunGlow.radius + '"><stop offset="0%" stop-color="' + M.sunGlow.color + '" stop-opacity="' + M.sunGlow.opacity + '"/><stop offset="50%" stop-color="' + M.sunGlow.color + '" stop-opacity="' + (M.sunGlow.opacity * 0.45) + '"/><stop offset="100%" stop-color="' + M.sunGlow.color + '" stop-opacity="0"/></radialGradient>';
  var ground = groundColors(M);
  o += '<linearGradient id="lb-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + ground.top + '"/><stop offset="100%" stop-color="' + ground.bot + '"/></linearGradient>';
  if (M.groundLight) {
    o += '<linearGradient id="lb-ray-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffdca0" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffdca0" stop-opacity="0"/></linearGradient>';
    o += '<linearGradient id="lb-ray-shadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#05070d" stop-opacity="0"/><stop offset="100%" stop-color="#05070d" stop-opacity="0.6"/></linearGradient>';
    o += '<radialGradient id="lb-gpool" gradientUnits="userSpaceOnUse" cx="' + M.groundLight.x + '" cy="' + HY + '" r="' + (W * 0.45) + '"><stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffe0a0" stop-opacity="0"/></radialGradient>';
  }
  if (M.groundShade > 0.01 && M.sunLightPos) o += '<radialGradient id="lb-shade" gradientUnits="userSpaceOnUse" cx="' + Math.max(0, Math.min(W, M.sunLightPos.x)) + '" cy="' + HY + '" r="' + (W * 0.85) + '"><stop offset="0%" stop-color="#03050b" stop-opacity="' + (M.groundShade * 0.35) + '"/><stop offset="100%" stop-color="#03050b" stop-opacity="' + M.groundShade + '"/></radialGradient>';
  o += "</defs>";

  o += worldOpen;
  if (M.sunGlow) o += '<rect x="0" y="0" width="' + W + '" height="' + HY + '" fill="url(#lb-sunglow)"/>';
  if (M.nightDepth > 0.02) {
    o += '<g aria-hidden="true">';
    STARS.forEach(function (s) {
      var op = clamp01((M.nightDepth - s.reveal) / 0.28) * s.b;
      if (op < 0.015) return;
      var stl = anim ? ' class="moons-star" style="animation-duration:' + s.dur + 's;animation-delay:' + aDelay(t, s.dur, s.delay) + 's"' : '';
      o += '<circle' + stl + ' cx="' + (s.fx * W) + '" cy="' + s.y + '" r="' + s.r + '" fill="#dfe9ff" opacity="' + op + '"/>';
    });
    o += '</g>';
  }
  var arcD = "M " + (CX - ARC_RX) + " " + HY + " A " + ARC_RX + " " + SC.ARC_RY + " 0 0 1 " + (CX + ARC_RX) + " " + HY;
  o += '<g mask="url(#lb-arcfade)"><path d="' + arcD + '" class="moons-arc-halo" fill="none"/><path d="' + arcD + '" class="moons-arc-guide" fill="none"/></g>';

  var sunOccl = M.upLit.length > 0 ? ' mask="url(#lb-sun-occl)"' : '';
  if (M.sunBody && M.sunPhase.day) {
    o += "<g" + sunOccl + "><title>" + SUN_LORE + "</title>";
    o += '<circle cx="' + M.sunBody.x + '" cy="' + M.sunBody.y + '" r="' + (SUN_R * 2.7) + '" fill="url(#lb-sun-halo)"/>';
    o += '<circle cx="' + M.sunBody.x + '" cy="' + M.sunBody.y + '" r="' + (SUN_R * 1.08) + '" fill="url(#lb-sun)" filter="url(#lb-sun-soft)"/>';
    if (anim && M.sunPhase.progress <= NEAR) o += rings(M.sunBody.x, M.sunBody.y, 16, "#f8ce4e", "rise", t);
    if (anim && M.sunPhase.progress >= 1 - NEAR) o += rings(M.sunBody.x, M.sunBody.y, 16, "#f8ce4e", "set", t);
    o += "</g>";
  }
  if (M.sunCrest) {
    o += "<g" + sunOccl + "><title>" + SUN_LORE + "</title>";
    o += '<circle cx="' + M.sunCrest.x + '" cy="' + M.sunCrest.y + '" r="' + (SUN_R * 2.7) + '" fill="url(#lb-sun-halo)"/>';
    o += '<circle cx="' + M.sunCrest.x + '" cy="' + M.sunCrest.y + '" r="' + (SUN_R * 1.08) + '" fill="url(#lb-sun)" filter="url(#lb-sun-soft)"/>';
    if (anim) o += rings(M.sunCrest.x, M.sunCrest.y, SUN_R + 4, M.sunCrest.kind === "rise" ? "#f8ce4e" : "#e09a28", M.sunCrest.kind, t);
    o += "</g>";
  }
  M.upLit.slice().sort(function (a, b) { return MOON_DEPTH[a.b.k] - MOON_DEPTH[b.b.k]; }).forEach(function (u) { o += moonDiscGroup(u, M, anim, t, NEAR); });
  M.conjunctions.forEach(function (c) {
    var mx = (c.a.x + c.b.x) / 2, my = (c.a.y + c.b.y) / 2;
    var span = Math.hypot(c.a.x - c.b.x, c.a.y - c.b.y) / 2 + Math.max(c.a.s.r, c.b.s.r) + 4;
    var deg = Math.atan2(c.b.y - c.a.y, c.b.x - c.a.x) * 180 / Math.PI;
    o += '<ellipse cx="' + mx + '" cy="' + my + '" rx="' + span + '" ry="' + (Math.max(c.a.s.r, c.b.s.r) + 5) + '" transform="rotate(' + deg + ' ' + mx + ' ' + my + ')" fill="none" stroke="#dbe9f5" stroke-width="1" opacity="0.22"/>';
  });
  o += '<rect x="0" y="' + HY + '" width="' + W + '" height="' + (H - HY) + '" fill="url(#lb-ground)"/>';
  if (M.groundLight) o += '<g opacity="' + M.groundLight.low + '" aria-hidden="true"><rect x="0" y="' + HY + '" width="' + W + '" height="' + (H - HY) + '" fill="url(#lb-gpool)"/></g>';

  var snowLand = M.landSeason === "winter";
  o += '<line x1="8" y1="' + HY + '" x2="' + (W - 8) + '" y2="' + HY + '" class="moons-horizon"/>';
  o += '<path d="' + ridgePath(W, 1.5, 5) + '" class="moons-ridge moons-ridge--far' + (snowLand ? " moons-ridge--snow" : "") + '"/>';
  o += '<path d="' + ridgePath(W, 1, 0) + '" class="moons-ridge moons-ridge--near' + (snowLand ? " moons-ridge--snow" : "") + '"/>';
  if (snowLand) o += '<path d="' + ridgePath(W, 1, 0) + '" class="moons-ridge-snowcap" fill="none"/>';
  if (M.groundShade > 0.01 && M.sunLightPos) o += '<rect x="0" y="' + HY + '" width="' + W + '" height="' + (H - HY) + '" fill="url(#lb-shade)"/>';

  o += landscapeSVG(M);

  if (M.groundLight) {
    o += '<g opacity="' + M.groundLight.low + '" aria-hidden="true">';
    RAY_FRACS.forEach(function (frac, i) {
      var tx = frac * W, bw = 7 + (i % 3) * 4;
      var cls = (anim && M.groundLight.rising) ? "moons-ray moons-ray--anim" : "moons-ray";
      var stl = (anim && M.groundLight.rising) ? ' style="animation-delay:' + aDelay(t, 5, i * 1.3) + 's"' : '';
      o += '<polygon class="' + cls + '"' + stl + ' points="' + M.groundLight.x + ',' + HY + ' ' + (tx - bw) + ',' + H + ' ' + (tx + bw) + ',' + H + '" fill="url(#lb-' + (M.groundLight.rising ? "ray-light" : "ray-shadow") + ')"/>';
    });
    o += '</g>';
  }

  var isNight = M.wNight > 0.35, isDusk = M.sky === "dusk";
  if (anim && isNight) {
    o += '<g aria-hidden="true">';
    SHOOTS.forEach(function (s) {
      var x0 = s.sx * W, len = Math.hypot(s.dx, s.dy) || 1;
      o += '<g class="moons-shooting" style="--sx:' + x0 + "px;--sy:" + s.sy + "px;--ex:" + (x0 + s.dx) + "px;--ey:" + (s.sy + s.dy) + "px;--dur:" + s.dur + "s;animation-delay:" + aDelay(t, s.dur, s.delay) + 's">';
      o += '<line x1="0" y1="0" x2="' + ((s.dx / len) * 16) + '" y2="' + ((s.dy / len) * 16) + '" stroke="url(#lb-shoot)" stroke-width="1.4" stroke-linecap="round"/></g>';
    });
    o += '</g>';
  }
  if (anim && M.landSeason === "summer" && (isNight || isDusk)) {
    o += '<g aria-hidden="true">';
    FIREFLIES.forEach(function (f) { o += '<circle class="moons-firefly" cx="' + (f.x * W) + '" cy="' + f.y + '" r="1.15" style="animation-duration:' + f.dur + "s;animation-delay:" + aDelay(t, f.dur, f.delay) + "s;--drift:" + f.drift + 'px"/>'; });
    o += '</g>';
  }
  if (anim && M.landSeason === "autumn") {
    o += '<g aria-hidden="true">';
    LEAVES.forEach(function (l) { o += '<ellipse class="moons-leaf" cx="' + (l.x * W) + '" cy="' + (HY - 8) + '" rx="' + (l.r * 1.35) + '" ry="' + (l.r * 0.65) + '" fill="' + mixHex(l.c, "#2e2015", M.landNight) + '" style="animation-duration:' + l.dur + "s;animation-delay:" + aDelay(t, l.dur, l.delay) + "s;--fall:" + (H - HY + 14) + "px;--sway:" + l.sway + 'px"/>'; });
    o += '</g>';
  }
  // Below-horizon schematic (drawn over the landscape so it stays visible): a
  // dashed arc dipping under the horizon that carries the down-moons as ghosted,
  // dashed-rim discs. Echoes the pre-Lichborne view - moons that have set keep
  // travelling out of sight until they rise again. The arc meets the sky arc
  // exactly at the horizon corners, so rise/set stays continuous.
  var underD = "M " + (CX - ARC_RX) + " " + HY + " A " + ARC_RX + " " + SC.UNDER_DEPTH + " 0 0 0 " + (CX + ARC_RX) + " " + HY;
  o += '<g mask="url(#lb-underfade)"><path d="' + underD + '" class="moons-underarc" fill="none"/></g>';
  M.downBodies.slice().sort(function (a, b) { return MOON_DEPTH[a.k] - MOON_DEPTH[b.k]; }).forEach(function (b) {
    o += '<g class="moons-underbody"><title>' + MOON_LORE[b.k] + "\n\n" + (b.rem <= 0 ? "Rising any moment" : "Rises in " + b.rem + "m") + "</title>";
    o += '<circle cx="' + b.x + '" cy="' + b.y + '" r="' + b.s.r + '" fill="url(#lb-moon-' + b.k + ')"/>';
    o += '<circle cx="' + b.x + '" cy="' + b.y + '" r="' + (b.s.r + 0.8) + '" fill="none" stroke="' + b.s.rim + '" stroke-width="0.7" stroke-dasharray="1.8 1.6"/>';
    o += "</g>";
  });

  o += "</g>";   // end world group

  // Labels (upright; positioned with PX so they read on either facing).
  var phaseWord = skyPhaseLabel(M.sunPhase), dp = timeOfDay(M.date.sid, M.date.doy);
  var showDp = dp && dp.toLowerCase() !== phaseWord.toLowerCase();
  o += '<text x="' + CX + '" y="' + (HY - (showDp ? 44 : 28)) + '" class="moons-phase-label" text-anchor="middle">' + phaseWord + '</text>';
  if (showDp) o += '<text x="' + CX + '" y="' + (HY - 29) + '" class="moons-phase-label moons-phase-sub" text-anchor="middle">(' + dp + ')</text>';
  o += '<text x="6" y="' + (HY - 4) + '" class="moons-label-cardinal">' + (faceNorth ? "W" : "E") + '</text>';
  o += '<text x="' + (W - 14) + '" y="' + (HY - 4) + '" class="moons-label-cardinal">' + (faceNorth ? "E" : "W") + '</text>';

  var placed = [];
  function placeChip(x, yStart, text, bodyY, bodyR) {
    var cw = text.length * 5.4, y = yStart;
    for (var tries = 0; tries < 4; tries++) {
      var hit = placed.some(function (c) { return Math.abs(c.x - x) < (c.w + cw) / 2 + 8 && Math.abs(c.y - y) < 12; });
      if (!hit) break;
      y = y + 13;
    }
    placed.push({ x: x, y: y, w: cw });
    return y;
  }
  if (M.sunBody && M.sunPhase.day) {
    var sx = PX(M.sunBody.x), stx = "sets in " + M.sunPhase.toNextMin + "m";
    o += '<text x="' + sx + '" y="' + (M.sunBody.y - SUN_R - 8) + '" class="moons-name" text-anchor="middle">Sun</text>';
    o += '<text x="' + sx + '" y="' + placeChip(sx, M.sunBody.y + SUN_R + 12, stx, M.sunBody.y, SUN_R) + '" class="moons-chip" text-anchor="middle">' + stx + '</text>';
  }
  M.upBodies.forEach(function (b) {
    var bx = PX(b.x), tt = b.rem <= 0 ? "setting..." : "sets in " + b.rem + "m";
    o += '<text x="' + bx + '" y="' + (b.y - b.s.r - 6) + '" class="moons-name" text-anchor="middle">' + b.s.label + '</text>';
    o += '<text x="' + bx + '" y="' + placeChip(bx, b.y + b.s.r + 12, tt, b.y, b.s.r) + '" class="moons-chip" text-anchor="middle">' + tt + '</text>';
  });
  M.downBodies.forEach(function (b) {
    var bx = PX(b.x), tt = b.rem <= 0 ? "rising..." : "rises in " + b.rem + "m";
    o += '<g class="moons-underlabel"><text x="' + bx + '" y="' + (b.y - b.s.r - 5) + '" class="moons-name" text-anchor="middle">' + b.s.label + '</text>';
    o += '<text x="' + bx + '" y="' + placeChip(bx, b.y + b.s.r + 11, tt, b.y, b.s.r) + '" class="moons-chip" text-anchor="middle">' + tt + '</text></g>';
  });

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("preserveAspectRatio", "xMidYMax meet");
  svg.innerHTML = o;
}

// Cache the expensive forward-scan targets; refresh periodically.
var targets = null, targetsAt = 0;
function refreshTargets() {
  var t = Math.floor(Date.now() / 1000);
  targets = { full: {} };
  for (var k = 0; k < MOON_ORDER.length; k++) {
    targets.full[MOON_ORDER[k]] = nextPhaseIndexTime(MOON_ORDER[k], t, 4, 25);
  }
  targets.allup = conjunction(t, true, 30);
  targets.alldown = conjunction(t, false, 30);
  targetsAt = t;
}

function buildMoonCards() {
  var host = document.getElementById("moons");
  host.innerHTML = "";
  MOON_ORDER.forEach(function (m) {
    var c = MOONS[m];
    var el = document.createElement("div");
    el.className = "moon " + c.cls;
    el.innerHTML =
      '<div class="disc" id="disc-' + m + '"></div>' +
      '<div style="flex:1">' +
        '<div class="name">' + c.label + '</div>' +
        '<div class="phase" id="phase-' + m + '">-</div>' +
        '<div class="row"><span class="lbl">Horizon</span><span id="horizon-' + m + '">-</span></div>' +
        '<div class="row"><span class="lbl" id="evlbl-' + m + '">Next event</span><span id="event-' + m + '">-</span></div>' +
        '<div class="row"><span class="lbl">Next phase</span><span id="np-' + m + '">-</span></div>' +
        '<div class="row"><span class="lbl">Next full</span><span id="full-' + m + '">-</span></div>' +
      '</div>';
    host.appendChild(el);
  });
}

function render() {
  var now = Date.now() / 1000;
  var ti = Math.floor(now);

  // Refresh cached scans every 30s or when a target has passed.
  if (!targets || (ti - targetsAt) > 30 ||
      (targets.allup && ti > targets.allup.end) ||
      (targets.alldown && ti > targets.alldown.end)) {
    refreshTargets();
  }

  var d = calcDate(ti);
  document.getElementById("cal-date").innerHTML =
    d.year + "-" + pad2(d.month) + "-" + pad2(d.day) +
    " <small>" + (MONTH_NAMES[d.month] || "") + "</small>";
  document.getElementById("cal-hour").innerHTML =
    pad2(d.anlas) + ":" + pad2(d.rois) + " <small>" + ANLAS_NAMES[d.anlas] + "</small><br>" +
    "<small>" + season(d.doy) + " &middot; " + yearName(d.year) + "</small>";

  var sun = sunPosition(ti);
  var tod = timeOfDay(d.sid, d.doy);
  document.getElementById("sun").innerHTML =
    (sun.visible ? "up" : "down") + " <small>(" + tod + ")</small><br>" +
    "<small>" + (sun.event === "set" ? "sets" : "rises") + " in " + fmt(sun.seconds) + "</small>";

  MOON_ORDER.forEach(function (m) {
    var pos = moonPos(m, now);
    var ph = phaseAt(m, ti);
    var np = nextPhase(m, ti);
    var illumC = (1 - Math.cos(ph.angle * Math.PI / 180)) / 2;
    document.getElementById("disc-" + m).innerHTML =
      moonCardSVG(m, { illum: illumC, waxing: ph.angle < 180 }, now);
    document.getElementById("phase-" + m).textContent = ph.name;
    var hz = document.getElementById("horizon-" + m);
    hz.textContent = pos.visible ? "above" : "below";
    hz.className = pos.visible ? "status-up" : "status-down";
    document.getElementById("evlbl-" + m).textContent = pos.visible ? "Sets in" : "Rises in";
    document.getElementById("event-" + m).textContent = fmt(pos.seconds);
    document.getElementById("np-" + m).textContent = np.name + " in " + fmt(np.seconds);
    var ft = targets.full[m];
    document.getElementById("full-" + m).textContent =
      (ph.index === 4) ? "now" : (ft == null ? "-" : fmt(ft - ti));
  });

  function conjText(c) {
    if (!c) return "none within 30 days";
    if (c.start <= ti) return "now, ends in " + fmt(c.end - ti);
    return "in " + fmt(c.start - ti) + " (lasts " + fmt(c.end - c.start) + ")";
  }
  document.getElementById("allup").textContent = conjText(targets.allup);
  document.getElementById("alldown").textContent = conjText(targets.alldown);

  renderScene(now);
}

document.getElementById("foot").innerHTML =
  'Katamba, Xibar and Yavash - computed live in your browser from the wall clock. No server, offline-capable.' +
  '<br>' +
  'How this works, the model, and how to deploy: ' +
  '<a href="https://moonwatch.dr.elanthia.online/README.html" style="color:var(--accent)">read the documentation</a>.' +
  '<br>' +
  'Sky scene graphics adapted, with permission, from ' +
  '<a href="https://github.com/SekmehtDR/Lichborne" style="color:var(--accent)">Lichborne</a> by Sekmeht and Binu.' +
  '<br>' +
  'Feedback, comments, please look for Mahtra on the ' +
  '<a href="https://discord.com/invite/f8ne99pVva" style="color:var(--accent)">Lich discord</a>.';

buildMoonCards();
render();
setInterval(render, 1000);
document.getElementById("facing-north").addEventListener("change", render);
// Re-render when the OS reduced-motion preference changes so the scene's motion
// gating (and the belt-and-suspenders CSS) take effect immediately.
if (window.matchMedia) {
  var _rm = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (_rm.addEventListener) _rm.addEventListener("change", render);
  else if (_rm.addListener) _rm.addListener(render);
}
</script>
</body>
</html>
